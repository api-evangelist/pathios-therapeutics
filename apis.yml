description: Pathios Therapeutics is a clinical-stage oncology and immunology drug discovery
  and development company based in Oxfordshire, United Kingdom, founded in 2017. The company
  develops small-molecule inhibitors of the pH-sensing G protein-coupled receptor GPR65 to
  counteract the immunosuppressive tumor microenvironment; its lead asset PTT-4256 is a
  first-in-class GPR65 inhibitor now in a Phase 1/2 clinical trial. Backed by Canaan, Brandon
  Capital, and a strategic investment from Bristol Myers Squibb, Pathios is a research-stage
  biotech with no public API, developer platform, or technical integration surface. This
  profile was surfaced as a portfolio company of canaan-partners and processed by the
  enrichment pipeline, which confirmed there is no API surface to catalog.
